site_name: PDSNO
site_description: Partially Distributed Software-Defined Network Orchestrator — open-source multi-vendor network governance
site_author: Alexander Adjei
site_url: https://preacher1045.github.io/PDSNO_DOCS_SITE/
repo_url: https://github.com/preacher1045/Partially-Distributed-Smart-Network-Optimizer-PDSNO-
repo_name: "Partially-Distributed-Smart-Network-Optimizer-PDSNO-"
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.code.copy
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  logo: assets/images/logo.png

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/preacher1045/Partially-Distributed-Smart-Network-Optimizer-PDSNO-

plugins:
  - search
  - mike

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes

nav:
  - Home: index.md

  - Getting Started:
      - What is PDSNO: getting-started/what-is-pdsno.md
      - How it works: getting-started/how-it-works.md
      - Quick start: getting-started/quick-start.md
      - System goals: getting-started/system-goals.md

  - Concepts:
      - Controller hierarchy: concepts/controller-hierarchy.md
      - Controller validation: concepts/controller-validation.md
      - Network Information Base: concepts/network-information-base.md
      - Device discovery: concepts/device-discovery.md
      - Config approval: concepts/config-approval.md
      - Policy propagation: concepts/policy-propagation.md
      - Communication model: concepts/communication-model.md
      - Security model: concepts/security-model.md

  - Security:
      - Threat model: security/threat-model.md

  - Reference:
      - API reference: reference/api-reference.md
      - Data models: reference/data-models.md
      - Scan policy: reference/scan-policy.md
      - Deployment guide: reference/deployment-guide.md
      - Repository structure: reference/repository-structure.md

  - Design Decisions:
      - Overview: design-decisions/index.md
      - Roadmap and Vision: design-decisions/roadmap-vision.md

  - Contributing:
      - How to contribute: contributing/how-to-contribute.md
      - Testing framework: contributing/testing-framework.md

  - Vendor Analysis:
      - Overview: vendor-analysis/overview.md
      - Gap analysis: vendor-analysis/gap-analysis.md